<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Memorang Skills</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ChatKit Web -->
    <script src="https://cdn.platform.openai.com/deployments/chatkit/chatkit.js"></script>

    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: #f9fafb;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 20px;
      }
      
      openai-chatkit {
        display: block;
        height: 600px;
        width: 400px;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        overflow: hidden;
        background: white;
      }
    </style>
  </head>
  <body>
    <h1>Quiz Chat</h1>
    <!-- The ChatKit component is a web component -->
    <openai-chatkit id="my-chat"></openai-chatkit>
    
    <script async defer>
      async function initializeChatKit() {
        // 1. Create a ChatKit session
        const sessionRes = await fetch("/api/chatkit/session", {
          method: "POST",
        });

        if (!sessionRes.ok) {
          throw new Error("Failed to create ChatKit session");
        }

        const { client_secret } = await sessionRes.json();

        // 2. Initialize ChatKit AFTER the session exists
        const chatkit = document.getElementById('my-chat');

        const api = {
          domainKey: "org-WGewayeU0rMuUmbGS53ixdKd",
          fetch: (url, options = {}) => {
            return fetch(url, {
              ...options,
              headers: {
                ...(options.headers || {}),
                Authorization: `Bearer ${client_secret}`,
              },
            });
          },
          url: "http://localhost:3000/api/chat",
          uploadStrategy: {
            // type: "two_phase",
            type: "direct",
            uploadUrl: "http://localhost:3000/api/chatkit/upload"
          }
        }

        // const api = {
        //   async getClientSecret(currentClientSecret) {
        //     const res = await fetch('/api/chatkit/session', { method: 'POST' })
        //     const {client_secret} = await res.json();
        //     return client_secret
        //   }
        // }


        chatkit.setOptions({
          api,
          startScreen: {
            greeting: "Upload a PDF (up to 5MB) and let's test your knowledge with a quiz!",
          },
          composer: {
            attachments: {
              enabled: true,
              accept: { "application/pdf": [".pdf"] },
              maxCount: 1,
              maxSize: 5 * 1024 * 1024, // 5MB
            },
          },
          initialThread: null,
        })
      }

      initializeChatKit().catch(console.error);
    </script>
  </body>
</html>
