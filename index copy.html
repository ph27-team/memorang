<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Memorang Skills</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ChatKit Web -->
    <script
    src="https://cdn.platform.openai.com/deployments/chatkit/chatkit.js"
    async
    ></script>

    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: #f9fafb;
      }

      #chatkit-root {
        height: 100vh;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="chatkit-root">
      <button>Open ChatKit</button>
    </div>

    <script>
      const chatkit = new window.OpenAIChatKit({
        root: document.getElementById("chatkit-root"),

        agent: {
          type: "workflow",
          id: "wf_695d65bedf988190bbe558182137da8a07a79a37a54f3ee6",
          version: 'version="3"',
        },

        runtime: {
          type: "server",
          server: "http://localhost:3000/api/chat",
          // server: "https://memorang-six.vercel.app/api/chat",
        },
      });

      chatkit.start();
    </script>
  </body>
</html>
